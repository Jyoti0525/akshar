# Render Blueprint — the public link.
#
# Hugging Face was the plan: a scan peaks at 1.8 GB and stays there, and only a
# free CPU Space had that headroom. Docker Spaces and CPU Basic are both paid on
# the account this is deployed from, and ZeroGPU — the one free tier left there —
# refuses to start a Space with no `@spaces.GPU` function, which an API server
# has no honest reason to declare.
#
# So this is Render's free tier, and it is chosen with its limit stated rather
# than discovered: **512 MB, against a scan that needs 1.8 GB.**
#
# ---------------------------------------------------------------------------
# WHAT THAT MEANS, AND WHY IT IS A DEPLOYMENT RATHER THAN A BROKEN ONE
# ---------------------------------------------------------------------------
# The weights are not in git (see `.gitignore`), so a build from this repository
# produces an image with no models in it at all — which is the correct image for
# 512 MB, because loading them would exhaust it on the first photograph.
#
# `vision/runtime.py` treats a missing model as a first-class state:
# `ModelUnavailableError`, caught by the pipeline and reported as a degradation
# tier. So the hosted instance runs, records every scan, and says which tier it
# ran at. Nothing raises and nothing is silently wrong.
#
# Working on the hosted link: sign-in and role-based access, all 37 rules with
# their gazette citations, the dashboard, search, products, the offline outbox,
# and report export in both formats. Degraded: reading the label from a
# photograph, which needs the memory this tier does not have.
#
# ---------------------------------------------------------------------------
# TWO THINGS TO SET BY HAND AFTER THE FIRST DEPLOY
# ---------------------------------------------------------------------------
#   AKSHAR_DATABASE_URL   on akshar-api. The Neon connection string as a
#                         SQLAlchemy URL: postgresql+psycopg://…  — the driver
#                         must be named or SQLAlchemy will not load psycopg 3.
#
#   AKSHAR_API_ORIGIN     on akshar-web, once the API has a URL. The full
#                         origin including https://, because `serverFetch`
#                         concatenates it with the request path.
#
# `AKSHAR_JWT_SECRET` is generated by Render and never leaves it.
#
# Free services sleep after about 15 minutes idle and take roughly a minute to
# wake. Say so in the submission so a cold first click does not read as broken.

services:
  # --------------------------------------------------------------------------
  # The API. Docker, so the native libraries WeasyPrint needs — Pango, cairo,
  # harfbuzz — are the same ones `docker compose` installs locally. A PDF is
  # what an officer files, and it is the one thing that cannot be got back if
  # the runtime lacks the libraries for it.
  # --------------------------------------------------------------------------
  - type: web
    name: akshar-api
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: AKSHAR_JWT_SECRET
        generateValue: true
      # Set in the dashboard. Marked `sync: false` so the Blueprint never
      # carries a database credential in version control.
      - key: AKSHAR_DATABASE_URL
        sync: false
      - key: AKSHAR_ENVIRONMENT
        value: production
      # Both degrade to `None` rather than raising when unset — see
      # `api/deps/resources.py`. The outbox and evidence storage are what is
      # lost, not the scan path.
      - key: AKSHAR_STORAGE
        value: sql
      - key: PORT
        value: "8000"

  # --------------------------------------------------------------------------
  # The web app. A browser only ever talks to this origin: `/api/v1/*` is a
  # route handler that reads the httpOnly session cookie and attaches the bearer
  # token server-side, which is what keeps the token out of page JavaScript and
  # what makes COEP `require-corp` workable at all. See `docs/deployment.md` §2.
  # --------------------------------------------------------------------------
  - type: web
    name: akshar-web
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Server-side only, and never sent to the browser.
      #
      # Set by hand in the dashboard once the API has its URL, as
      # `https://akshar-api-xxxx.onrender.com`. Render's `fromService` can
      # supply a host or a host:port but not a scheme, and this has to be a full
      # origin — `serverFetch` concatenates it with the path.
      - key: AKSHAR_API_ORIGIN
        sync: false
