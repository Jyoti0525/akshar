name: CI

# AKSHAR.md section 15b: "pytest + pytest-benchmark + Playwright + GitHub
# Actions. Ruff for lint, mypy strict on contracts/ and rules/. Benchmark job
# fails the build on latency regression against section 4's budget."
#
# Four jobs, and the split is deliberate. `python` is the one that must never be
# red — it holds the rules engine, which is the legal core. `web` is independent
# of it and runs in parallel. `contract` is the job that catches the failure
# nobody notices: a Pydantic model changing shape while the TypeScript generated
# from it stays as it was. `e2e` runs last because it needs both halves built.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never a real secret: every job here runs against ephemeral in-memory stores.
  # The API refuses to start without one, which is the behaviour we want in
  # production and an inconvenience here.
  AKSHAR_JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
  PYTHONIOENCODING: utf-8

jobs:
  python:
    name: Rules, vision and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy — strict on contracts and rules only
        # Section 15b: strict where a wrong type is a wrong verdict, and not
        # everywhere else, because a strict-everywhere config that nobody can
        # keep green is a config that gets switched off.
        run: mypy contracts rules

      - name: Tests
        # `integration` needs Postgres, Redis and MinIO; `needs_corpus` needs
        # photographs that are not in the repository. Everything else must pass
        # on a laptop with nothing running, because a suite that needs Docker to
        # start is a suite that stops being run before pushing.
        run: pytest -q -m "not integration and not needs_corpus"

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build, including the service worker
        run: npm run build

      - name: The cached bundle must stay under section 5's 60 MB
        run: |
          size=$(du -sb .next/static public | awk '{total += $1} END {print total}')
          echo "shell + public: $size bytes"
          if [ "$size" -gt 62914560 ]; then
            echo "::error::The cached bundle is over section 5's 60 MB budget."
            exit 1
          fi

  contract:
    name: OpenAPI types have not drifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: web

      - name: Regenerate from the live schema
        # Section 15b: "types generated from the FastAPI OpenAPI schema via
        # openapi-typescript, so frontend types cannot drift from contracts/."
        # A generated file that is committed and never regenerated drifts
        # silently; this is what makes the guarantee real.
        run: |
          python -c "
          import json, os
          from api.main import app
          json.dump(app.openapi(), open('web_openapi.json', 'w'))
          "
          cd web && npx openapi-typescript ../web_openapi.json -o src/lib/api/schema.gen.ts

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --quiet -- web/src/lib/api/schema.gen.ts; then
            echo "::error::web/src/lib/api/schema.gen.ts is out of date. Run 'npm run gen:api' in web/."
            git diff -- web/src/lib/api/schema.gen.ts
            exit 1
          fi

  e2e:
    name: Playwright, including the offline run
    runs-on: ubuntu-latest
    needs: [web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
