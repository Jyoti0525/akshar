# Alembic — AKSHAR.md section 10.
#
# `db/schema.sql` is the readable reference and what a fresh `docker compose`
# initialises from. Alembic owns CHANGE. The two must not drift, and
# `tests/unit/test_schema.py` asserts they do not.

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# Left empty on purpose. The URL comes from AKSHAR_DATABASE_URL at runtime
# (see db/migrations/env.py) so a connection string never sits in the repo.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
