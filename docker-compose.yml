# AKSHAR — one-command local stack.
# Submission checklist (section 20) requires: `docker compose up` from a clean clone.
name: akshar

services:
  # --------------------------------------------------------------------------
  # Postgres 17 + pgvector 0.8 (section 15b).
  # One store: relational rows, JSONB declaration sets, and vector(512) SKU
  # embeddings. The 1,700-row rule corpus is deliberately left UNINDEXED —
  # a sequential scan beats HNSW at that size (section 15).
  # --------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: akshar
      POSTGRES_PASSWORD: akshar
      POSTGRES_DB: akshar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akshar -d akshar"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------------------
  # Redis 7 — Dramatiq broker for bulk image jobs (section 12).
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --------------------------------------------------------------------------
  # MinIO — evidence objects. Images NEVER go in the database (section 6).
  # The evidence bucket is versioned and write-once so both alteration and
  # deletion are detectable.
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: akshar
      MINIO_ROOT_PASSWORD: akshar-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the two buckets and locks the evidence bucket to write-once.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 akshar akshar-secret &&
      mc mb --ignore-existing --with-versioning local/akshar-evidence &&
      mc mb --ignore-existing local/akshar-derived &&
      mc retention set --default GOVERNANCE 7y local/akshar-evidence || true;
      echo 'buckets ready'
      "

  # --------------------------------------------------------------------------
  # API — FastAPI + Pydantic v2, async, uvloop (section 12).
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      AKSHAR_DATABASE_URL: postgresql+psycopg://akshar:akshar@db:5432/akshar
      AKSHAR_REDIS_URL: redis://redis:6379/0
      AKSHAR_MINIO_ENDPOINT: minio:9000
      AKSHAR_MINIO_ACCESS_KEY: akshar
      AKSHAR_MINIO_SECRET_KEY: akshar-secret
      AKSHAR_JWT_SECRET: dev-only-change-me
      # Explicit, so the API never falls through to the in-process stub broker
      # and silently drops the evidence uploads it thinks it queued.
      AKSHAR_BROKER: redis
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app

  # --------------------------------------------------------------------------
  # Worker — Dramatiq consumer for bulk uploads (section 12).
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    # Both queues, one pool — section 8c. The weighting is NOT a flag here: it
    # is `BulkFairShare`, attached in `workers/broker.py`, which caps in-flight
    # `bulk` messages at half the pool so an interactive scan always finds a
    # free thread. A correctness property that depends on somebody remembering a
    # command-line argument is not a correctness property.
    command: dramatiq workers.tasks --queues scan bulk --processes 2 --threads 8
    environment:
      AKSHAR_DATABASE_URL: postgresql+psycopg://akshar:akshar@db:5432/akshar
      AKSHAR_REDIS_URL: redis://redis:6379/0
      AKSHAR_MINIO_ENDPOINT: minio:9000
      AKSHAR_MINIO_ACCESS_KEY: akshar
      AKSHAR_MINIO_SECRET_KEY: akshar-secret
      AKSHAR_BROKER: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

  # --------------------------------------------------------------------------
  # Web — Next.js 15 PWA. Inference runs in the BROWSER by default;
  # this container only serves the app shell and the model bundle (section 5).
  # --------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    environment:
      # Server-side only. The browser never talks to this host directly: it goes
      # to `/api/v1/*` on the web origin, where the route handler attaches the
      # session token. See `web/src/lib/api/session.ts`, and `next.config.ts`
      # for why everything has to be same-origin (COEP `require-corp`).
      AKSHAR_API_ORIGIN: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
